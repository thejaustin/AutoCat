name: Build Debug APK

on:
  push:
    branches: [ 15-dev, main ]
  pull_request:
    branches: [ 15-dev, main ]
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK with Gradle
      run: ./gradlew assembleLawnWithQuickstepGithubDebug --no-daemon --stacktrace
      env:
        GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: autocat-debug-apk
        path: lawnchair/build/outputs/apk/lawnWithQuickstepGithub/debug/*.apk
        retention-days: 14

    - name: Upload APK to release (on tag push)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: lawnchair/build/outputs/apk/lawnWithQuickstepGithub/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
