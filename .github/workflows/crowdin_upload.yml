name: Crowdin Upload

on:
  push:
    branches:
      - '*-dev'

jobs:

  synchronize-with-crowdin:
    name: Upload strings to Crowdin
    if: github.repository_owner == 'LawnchairLauncher'
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Upload Strings
      uses: crowdin/github-action@8818ff65bfc4322384f983ea37e3926948c11745 # v2
      with:
        upload_translations: false
        upload_sources: true
        download_translations: false
        localization_branch_name: 16-dev-localization
        create_pull_request: false
        base_url: 'https://lawnchair.crowdin.com'
      env:
        GITHUB_TOKEN: ${{ secrets.LAWNCHAIR_BOT_TOKEN }}
        CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
