plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace = "app.lawnchair.hiddenapi"
    buildFeatures {
        aidl = true
    }

    sourceSets {
        main {
            java.srcDirs = ['src']
            aidl.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
}

dependencies {
    annotationProcessor libs.rikka.annotation.processor
    compileOnly libs.rikka.annotation
}
