# ============================================================================
# BUILD POLICY - READ FIRST
# ============================================================================
# This project uses GitHub Actions EXCLUSIVELY for builds.
# Local builds on device (Termux) are NOT supported and will FAIL.
#
# See:
#   - NEVER_BUILD_LOCALLY.md
#   - CONTRIBUTING.md
#   - build.gradle (enforcement check)
#
# Safe commands: ./gradlew spotlessApply, ./gradlew tasks
# Build commands: Use GitHub Actions only
# ============================================================================

# Disable buildFeatures flags by default
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.useAndroidX=true
android.enableHiddenApiCheck=false
android.hideApiWarning=false

# Improve build performance by enabling R8 parallelism
android.r8.maxWorkers=4

# Enable non-transitive R classes (faster compilation)
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin optimizations
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.incremental.js=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true

# Gradle build optimizations
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:ParallelGCThreads=4
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.workers.max=4

# Kapt optimizations
kapt.incremental.apt=true
kapt.use.worker.api=true
kapt.include.compile.classpath=false
