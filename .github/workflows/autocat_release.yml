name: AutoCat Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v16.0.0-alpha1)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: true
  push:
    branches:
      - '16-dev'
    paths-ignore:
      - '**.md'
      - '.idea/**'
      - '.github/**.json'

jobs:
  build:
    name: Build & Sign AutoCat APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9
        with:
          cache-encryption-key: Da25KUVSE5jbGds2zXmfXw==

      - name: Write signing config
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo storePassword="$KEYSTORE_PASSWORD" >> keystore.properties
            echo keyAlias="$KEY_ALIAS" >> keystore.properties
            echo keyPassword="$KEY_PASSWORD" >> keystore.properties
            echo storeFile='${{ github.workspace }}/key.jks' >> keystore.properties
            echo "$KEYSTORE" | base64 --decode > ${{ github.workspace }}/key.jks
          fi

      - name: Build AutoCat Release APK
        env:
          CI_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleLawnWithQuickstepGithubRelease

      - name: Locate APK
        id: locate
        run: |
          APK=$(find build/outputs/apk -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK)" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: AutoCat-release-apk
          path: ${{ steps.locate.outputs.apk_path }}

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "tag=nightly-${{ github.run_number }}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "AutoCat ${{ steps.tag.outputs.tag }}"
          prerelease: ${{ github.event.inputs.prerelease != 'false' }}
          generate_release_notes: true
          files: ${{ steps.locate.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
